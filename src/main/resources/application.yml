spring:
  datasource:
    url: jdbc:mysql://139.196.82.162:3306/super-mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: jacl
    password: jacl
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  sql:
    init:
      mode: never
      continue-on-error: true

  jpa:
    hibernate:
      ddl-auto: none  # 禁用 Hibernate DDL
    show-sql: false

  main:
    allow-bean-definition-overriding: true
    
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  alipay:
    app-id: 9021000142693708
    private-key: 
    public-key: 
    alipay-public-key: 
    notify-url: http://localhost:8080/api/orders/alipay/notify
    return-url: http://localhost:8080/api/orders/alipay/return

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.supermall.backend.entity
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080

logging:
  level:
    root: INFO
